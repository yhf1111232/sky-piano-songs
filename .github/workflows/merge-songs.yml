name: Merge new songs into songlib.json
on:
  push:
    branches: [main]
    paths:
      - 'new_songs/**'
      - '.github/workflows/merge-songs.yml'
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge songs
        run: |
          python3 << 'PY'
          import json, glob, os
          with open('songlib.json') as f:
              lib = json.load(f)
          new_songs = []
          for fp in sorted(glob.glob('new_songs/song_*.json')):
              with open(fp) as f:
                  new_songs.append(json.load(f))
          new_names = {s['name'] for s in new_songs}
          lib['songs'] = [s for s in lib['songs'] if s['name'] not in new_names]
          lib['songs'].extend(new_songs)
          lib['version'] = 2
          with open('songlib.json', 'w') as f:
              json.dump(lib, f, ensure_ascii=False, separators=(',', ':'))
          print('Total songs:', len(lib['songs']), 'version:', lib['version'])
          PY
      - name: Commit merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add songlib.json
          git diff --staged --quiet || git commit -m 'chore: merge new songs v2 35 songs'
          git push
